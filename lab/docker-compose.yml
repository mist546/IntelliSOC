# IntelliSOC attack lab: a real target to attack while IntelliSOC watches.
#
#   target    Ubuntu running a real sshd and nginx. Their logs are written to
#             data/live_logs/lab/, which the soc-agent tails (config.yaml).
#   attacker  Kali with hydra, nmap, nikto and sqlmap, on the same private
#             network, so attacks come from a fixed IP (172.28.0.66).
#
# Ports are bound to 127.0.0.1 only: the deliberately weak target is never
# reachable from your LAN. See lab/README.md for usage.
#
# docker-compose.wazuh.yml layers a Wazuh manager on top (start_lab.ps1
# -Wazuh): the target's logs then go through Wazuh instead of the bind mount.
name: intellisoc-lab

services:
  target:
    build: ./target
    hostname: lab-web01
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:8080:80"
    volumes:
      - ../data/live_logs/lab:/var/log/lab
    networks:
      lab:
        ipv4_address: 172.28.0.10

  attacker:
    build: ./attacker
    hostname: attacker
    command: sleep infinity
    depends_on:
      - target
    networks:
      lab:
        ipv4_address: 172.28.0.66

networks:
  lab:
    ipam:
      config:
        - subnet: 172.28.0.0/24
