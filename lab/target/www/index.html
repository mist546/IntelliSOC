<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Acme Staff Portal</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; }
    main { max-width: 420px; margin: 60px auto; background: #fff; padding: 28px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    h1 { font-size: 1.3rem; margin-top: 0; }
    label { display: block; margin-top: 12px; font-size: .9rem; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    button { margin-top: 16px; padding: 8px 16px; }
    hr { margin: 24px 0; border: 0; border-top: 1px solid #ddd; }
    small { color: #777; }
  </style>
</head>
<body>
  <main>
    <h1>Acme Staff Portal</h1>
    <form action="/login" method="get">
      <label>Username <input name="user"></label>
      <label>Password <input name="pass" type="password"></label>
      <button>Sign in</button>
    </form>
    <hr>
    <form action="/search" method="get">
      <label>Search the staff directory <input name="q"></label>
      <button>Search</button>
    </form>
    <p><small>IntelliSOC attack lab target. Deliberately weak, for local testing only.</small></p>
  </main>
</body>
</html>
