<!--
  Wazuh agent config for the lab target (Wazuh mode only).

  It only ships the two logs IntelliSOC detects on - sshd (via rsyslog) and
  nginx - and turns off the agent's own scanners (file integrity, rootcheck,
  SCA, inventory), which would only add noise to IntelliSOC. entrypoint.sh
  replaces MANAGER_ADDRESS with $WAZUH_MANAGER before starting the agent.
-->
<ossec_config>
  <client>
    <server>
      <address>MANAGER_ADDRESS</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <agent_name>lab-web01</agent_name>
    </enrollment>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <sca>
    <enabled>no</enabled>
  </sca>

  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="cis-cat">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="osquery">
    <disabled>yes</disabled>
  </wodle>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/lab/auth.log</location>
  </localfile>

  <!-- "nginx" in the file name is how IntelliSOC labels these events
       NGINX_ACCESS rather than APACHE_ACCESS (parsing/wazuh.py). -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/lab/nginx_access.log</location>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
