# Minimal rsyslog for a container: no kernel log, no privilege drop (the
# log folder is a Windows bind mount). RSYSLOG_FileFormat writes RFC 3339
# timestamps with a UTC offset, so the agent converts them correctly
# regardless of the Windows host's timezone.
module(load="imuxsock")
$FileCreateMode 0644

auth,authpriv.*  action(type="omfile" file="/var/log/lab/auth.log" template="RSYSLOG_FileFormat")
