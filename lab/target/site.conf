server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.html;

    # Combined Log Format, which the soc-agent parses as NGINX_ACCESS.
    # Keep "nginx" in the name: in Wazuh mode it is how IntelliSOC tells
    # nginx from Apache events.
    access_log /var/log/lab/nginx_access.log combined;
    error_log /var/log/lab/error.log;

    location = /search {
        default_type text/html;
        return 200 '<p>No results found.</p><p><a href="/">Back</a></p>';
    }

    location = /login {
        default_type text/html;
        return 200 '<p>Invalid username or password.</p><p><a href="/">Back</a></p>';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
